services:
  bibitasks:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # По умолчанию API доступен только локальному reverse proxy.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      - bibitasks_data:/app/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bibitasks_data:
