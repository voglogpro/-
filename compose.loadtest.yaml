name: "${BIBITASKS_LOADTEST_PROJECT:?Use the generated unique load-test project}"

services:
  bibitasks:
    image: "${BIBITASKS_IMAGE:?Set an immutable GHCR image with @sha256 digest}"
    command: ["python", "scripts/deployment_guard.py", "python", "main.py"]
    restart: "no"
    env_file: "${BIBITASKS_LOADTEST_ENV_FILE:?Point to the disposable staging secrets file}"
    environment:
      BIBITASKS_DEPLOYMENT_IMAGE: "${BIBITASKS_IMAGE:?Set an immutable GHCR image with @sha256 digest}"
      BIBITASKS_ENVIRONMENT: staging
      PILOT_LOAD_TEST_ENABLED: "true"
      PILOT_LOAD_TEST_TELEGRAM_STUB_ENABLED: "true"
      DATA_DIR: /app/data
    expose: ["3000"]
    volumes:
      - loadtest_data:/app/data
    networks: [loadtest]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:3000/health/ready',headers={'X-Health-Token':os.environ['HEALTH_TOKEN']}); urllib.request.urlopen(r,timeout=3).close()"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: "no"
    environment:
      BIBITASKS_DOMAIN: "${BIBITASKS_LOADTEST_DOMAIN:?Set the disposable staging hostname}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.loadtest:/etc/caddy/Caddyfile:ro
      - loadtest_caddy_data:/data
      - loadtest_caddy_config:/config
    networks:
      loadtest:
        aliases:
          - "${BIBITASKS_LOADTEST_DOMAIN:?Set the disposable staging hostname}"
    depends_on:
      bibitasks:
        condition: service_started
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2015/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  loadtest-runner:
    image: "${BIBITASKS_IMAGE:?Use the same immutable image digest as the app}"
    profiles: ["loadtest"]
    command: ["python", "scripts/pilot_load_test.py"]
    restart: "no"
    env_file: "${BIBITASKS_LOADTEST_ENV_FILE:?Point to the disposable staging secrets file}"
    environment:
      BIBITASKS_ENVIRONMENT: staging
      PILOT_LOAD_TEST_ENABLED: "true"
      PILOT_LOAD_TEST_TELEGRAM_STUB_ENABLED: "true"
    volumes:
      - type: bind
        source: "${BIBITASKS_LOADTEST_EVIDENCE_DIR:?Use the generated private evidence directory}"
        target: /evidence
        bind:
          create_host_path: false
    networks: [loadtest]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}

networks:
  loadtest:
    name: "${BIBITASKS_LOADTEST_NETWORK:?Use the generated unique load-test network}"
    labels:
      com.bibitasks.purpose: loadtest

volumes:
  loadtest_data:
    name: "${BIBITASKS_LOADTEST_DATA_VOLUME:?Use a fresh bibitasks_loadtest_* volume}"
    labels:
      com.bibitasks.purpose: loadtest
      com.bibitasks.release-commit: "${BIBITASKS_RELEASE_COMMIT:?Bind the staging volume to a release commit}"
  loadtest_caddy_data:
    name: "${BIBITASKS_LOADTEST_CADDY_DATA_VOLUME:?Use the generated Caddy data volume}"
    labels:
      com.bibitasks.purpose: loadtest
      com.bibitasks.release-commit: "${BIBITASKS_RELEASE_COMMIT:?Bind the staging volume to a release commit}"
  loadtest_caddy_config:
    name: "${BIBITASKS_LOADTEST_CADDY_CONFIG_VOLUME:?Use the generated Caddy config volume}"
    labels:
      com.bibitasks.purpose: loadtest
      com.bibitasks.release-commit: "${BIBITASKS_RELEASE_COMMIT:?Bind the staging volume to a release commit}"
