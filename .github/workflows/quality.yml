name: quality

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit locked Node dependencies
        run: npm audit --audit-level=high
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Mini App browser smoke tests
        run: npm run test:frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: miniapp-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --requirement requirements.lock
      - name: Scan full Git history for secrets
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
      - name: Audit locked Python dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit --requirement requirements.lock --progress-spinner off
      - name: Compile backend
        run: python -m py_compile main.py scripts/backup.py scripts/backup_scheduler.py scripts/bootstrap_production_env.py scripts/deployment_guard.py scripts/final_release_record.py scripts/pilot_host_preflight.py scripts/pilot_monitor.py scripts/pilot_monitor_launcher.py scripts/recovery_key_canary.py scripts/release_candidate.py scripts/release_record.py scripts/restore.py scripts/secret_recovery_evidence.py scripts/sqlite_volume_rollback.py scripts/telegram_inventory.py scripts/telegram_preflight.py scripts/telegram_surface_setup.py
      - name: Core safety tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee core-tests.log
      - name: Linux Docker CAP_CHOWN and ownership integration
        if: runner.os == 'Linux'
        run: python -m tests.docker_sqlite_volume_rollback_integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: backend-core-test-log
          path: core-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: Smoke-test backup including media
        shell: bash
        run: |
          root="$(mktemp -d)"
          python - "$root" <<'PY'
          import json
          import sqlite3
          import subprocess
          import sys
          from contextlib import closing
          from pathlib import Path
          from cryptography.fernet import Fernet
          from scripts.recovery_key_canary import ensure_recovery_key_canary

          root = Path(sys.argv[1])
          data = root / "data"
          output = root / "output"
          (data / "task_photos").mkdir(parents=True)
          data.chmod(0o700)
          ensure_recovery_key_canary(
              data, Fernet(Fernet.generate_key()), Fernet(Fernet.generate_key()),
              production=True,
          )
          (data / "task_photos" / "sample.jpg").write_bytes(b"test-photo")
          with closing(sqlite3.connect(data / "bibitasks.db")) as db:
              db.execute("CREATE TABLE sample (value TEXT)")
              db.execute("INSERT INTO sample VALUES ('ok')")
              db.execute(
                  "CREATE TABLE telegram_update_inbox "
                  "(update_id INTEGER PRIMARY KEY,payload_json TEXT,status TEXT)"
              )
              db.execute(
                  "CREATE TABLE withdrawal_requests "
                  "(id INTEGER PRIMARY KEY,account_ciphertext TEXT,status TEXT)"
              )
              db.commit()
          result = subprocess.run(
              [sys.executable, "scripts/backup.py", "--data-dir", str(data),
               "--output-dir", str(output)],
              check=True, capture_output=True, text=True,
          )
          destination = Path(result.stdout.strip())
          manifest = json.loads((destination / "manifest.json").read_text("utf-8"))
          assert (destination / "task_photos" / "sample.jpg").read_bytes() == b"test-photo"
          assert manifest["database"]["integrity_check"] == "ok"
          assert manifest["media"][0]["path"] == "task_photos/sample.jpg"
          PY
      - name: Build production image
        run: docker build --tag bibitasks:ci .
      - name: Install pinned Compose validator
        shell: bash
        run: |
          compose="$RUNNER_TEMP/docker-compose-v5.3.1"
          curl --fail --show-error --silent --location \
            https://github.com/docker/compose/releases/download/v5.3.1/docker-compose-linux-x86_64 \
            --output "$compose"
          echo "f9ebc6ebdb19d769b793c245a736caaeb198c62587f13b25c660c13b4987f959  $compose" \
            | sha256sum --check --strict
          chmod 0500 "$compose"
          "$compose" version --short
      - name: Validate owner pilot stack syntax
        env:
          BIBITASKS_IMAGE: ghcr.io/voglogpro/bibitasks@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BIBITASKS_ENV_FILE: .env.example
          BACKUP_DIR: /tmp/bibitasks-backups
          BACKUP_SENTINEL: /tmp/bibitasks-backups/.bibitasks-offhost
          BIBITASKS_DOMAIN: tasks.example.com
          MONITOR_ALERT_BOT_TOKEN_FILE: /tmp/bibitasks-monitor-alert-token
          MONITOR_HEALTH_TOKEN_FILE: /tmp/bibitasks-monitor-health-token
          MONITOR_ALERT_CHAT_ID: -1001234567890
        shell: bash
        run: |
          mkdir -p "$BACKUP_DIR"
          touch "$BACKUP_SENTINEL"
          printf '123456:' > "$MONITOR_ALERT_BOT_TOKEN_FILE"
          printf '%040d\n' 0 >> "$MONITOR_ALERT_BOT_TOKEN_FILE"
          printf 'hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh\n' > "$MONITOR_HEALTH_TOKEN_FILE"
          chmod 0600 "$MONITOR_ALERT_BOT_TOKEN_FILE" "$MONITOR_HEALTH_TOKEN_FILE"
          sudo chown root:root "$MONITOR_ALERT_BOT_TOKEN_FILE" "$MONITOR_HEALTH_TOKEN_FILE"
          compose="$RUNNER_TEMP/docker-compose-v5.3.1"
          if ! message=$("$compose" -f compose.pilot.yaml config --quiet 2>&1); then
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Compose pilot validation failed::$message"
            exit 1
          fi
      - name: Prove monitor service health and privilege drop
        env:
          BIBITASKS_IMAGE: bibitasks:ci
          BIBITASKS_ENV_FILE: .env.example
          BACKUP_DIR: /tmp/bibitasks-backups
          BACKUP_SENTINEL: /tmp/bibitasks-backups/.bibitasks-offhost
          BIBITASKS_DOMAIN: tasks.example.com
          MONITOR_ALERT_BOT_TOKEN_FILE: /tmp/bibitasks-monitor-alert-token
          MONITOR_HEALTH_TOKEN_FILE: /tmp/bibitasks-monitor-health-token
          MONITOR_ALERT_CHAT_ID: -1001234567890
        shell: bash
        run: |
          set -euo pipefail
          compose="$RUNNER_TEMP/docker-compose-v5.3.1"
          project=bibitasks-monitor-ci
          files=(-f compose.pilot.yaml -f tests/fixtures/compose.monitor-ci.yaml)
          cleanup() { "$compose" -p "$project" "${files[@]}" down -v --remove-orphans; }
          trap cleanup EXIT
          "$compose" -p "$project" "${files[@]}" up -d --no-deps monitor
          container=$("$compose" -p "$project" "${files[@]}" ps -q monitor)
          test -n "$container"
          for _ in $(seq 1 30); do
            if docker exec --user 10001:10001 "$container" python -c \
              "from pathlib import Path; raise SystemExit(not Path('/var/lib/bibitasks-monitor/state.json').is_file())"; then
              break
            fi
            sleep 1
          done
          docker exec --user 10001:10001 "$container" python -c \
            "from pathlib import Path; assert Path('/var/lib/bibitasks-monitor/state.json').is_file()"
          "$compose" -p "$project" "${files[@]}" run --rm --no-deps --user 10001:10001 \
            --entrypoint python monitor -c \
            "from datetime import datetime,timezone; import json; from pathlib import Path; check={'failures':0,'alert_active':False,'last_healthy':True,'detail':'ci fixture','pending_incident':False,'pending_incident_detail':''}; state={'version':1,'last_check_at':datetime.now(timezone.utc).isoformat(),'checks':{name:dict(check) for name in ('application','dead_queues','backup')},'delivery':{'consecutive_failures':0,'error_since':None,'last_error_at':None}}; path=Path('/var/lib/bibitasks-monitor/state.json'); path.write_text(json.dumps(state,sort_keys=True)+'\n',encoding='utf-8'); path.chmod(0o600)"
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container")
            test "$status" = healthy && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          docker exec --user 10001:10001 "$container" python -c \
            "v=dict(line.split(':',1) for line in open('/proc/1/status') if ':' in line); assert v['Uid'].split()==['10001']*4; assert v['Gid'].split()==['10001']*4; assert not v['Groups'].split(); assert int(v['CapPrm'].strip(),16)==0 and int(v['CapEff'].strip(),16)==0"
          "$compose" -p "$project" "${files[@]}" run --rm --no-deps --user 10001:10001 \
            --entrypoint python monitor -c \
            "from pathlib import Path; Path('/var/lib/bibitasks-monitor/state.json').write_text('{',encoding='utf-8')"
          for _ in $(seq 1 10); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            test "$status" = unhealthy && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = unhealthy
      - name: Validate pilot security policy
        shell: bash
        run: |
          python - <<'PY'
          manifest = open("compose.pilot.yaml", encoding="utf-8").read()
          backup = manifest.split("\n  backup:\n", 1)[1].split("\n  caddy:\n", 1)[0]
          assert "env_file:" not in backup
          assert "network_mode: none" in backup
          assert manifest.count("create_host_path: false") == 2
          monitor = manifest.split("\n  monitor:\n", 1)[1].split("\n  caddy:\n", 1)[0]
          assert "env_file:" not in monitor
          assert "/var/run/docker.sock" not in monitor
          assert "bibitasks_data" not in monitor
          assert "monitor_alert_bot_token" in monitor
          assert "monitor_health_token" in monitor
          assert "backup_status:/run/bibitasks-backup:ro" in monitor
          assert 'user: "0:0"' in monitor
          assert "pilot_monitor_launcher.py" in monitor
          assert "--drop-only" in monitor
          assert "init: true" not in monitor
          assert 'cap_add: ["CHOWN", "SETGID", "SETUID"]' in monitor
          assert manifest.count("networks: [pilot]") == 3
          assert manifest.count('restart: "unless-stopped"') == 4
          assert "condition: service_started" in manifest
          unit = open("deploy/bibitasks-pilot.service.example", encoding="utf-8").read()
          assert "pilot_host_preflight.py" in unit
          assert "--wait --wait-timeout 180" in unit
          assert "TimeoutStartSec=300" in unit
          caddyfile = open("deploy/Caddyfile", encoding="utf-8").read()
          assert "@sensitive_routes path /telegram/webhook/* /task-photo/* /media/*" in caddyfile
          assert "log_skip @sensitive_routes" in caddyfile
          assert "http://127.0.0.1:2015" in caddyfile
          PY
      - name: Validate Caddy edge configuration
        run: >-
          docker run --rm --entrypoint caddy
          -e BIBITASKS_DOMAIN=tasks.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Smoke-test image identity and locked imports
        run: >-
          docker run --rm --entrypoint python bibitasks:ci -c
          "import os,subprocess,aiogram,aiohttp,aiosqlite,boto3,cryptography,PIL;
          assert os.getuid()!=0; assert os.access('/app/data',os.W_OK);
          assert os.path.isfile('/app/scripts/secret_recovery_evidence.py');
          assert os.path.isfile('/app/scripts/recovery_key_canary.py');
          assert subprocess.run(['python','scripts/recovery_key_canary.py','enroll-existing','--help'],stdout=subprocess.DEVNULL).returncode==0;
          assert subprocess.check_output(['/usr/local/bin/age','--version'],text=True).strip()=='v1.3.1'"
      - name: Validate tracked secrets and generated data
        shell: bash
        run: |
          test ! -e .env
          test ! -d data
          ! git grep -nE '[0-9]{6,12}:[A-Za-z0-9_-]{30,}' -- . ':(exclude).env.example'
          ! git ls-files | grep -E '(^|/)(bibitasks|production|deploy\.next)\.env$|\.secret$|(^|/)(secrets|evidence)/|(^|/)(rollback-plan|stage-report|activation-report|secret-recovery|monitor-drill|release-candidate|final-release).*\.json$'

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: bibitasks_migration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bibitasks_migration"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://bibitasks_migrator:ci-migration-only@127.0.0.1:5432/bibitasks_migration
      MIGRATION_EXPECTED_DATABASE: bibitasks_migration
      MIGRATION_EXPECTED_SCHEMA: public
      MIGRATION_EXPECTED_SERVER_ADDRESS: 127.0.0.1
      MIGRATION_EXPECTED_SERVER_PORT: "5432"
      MIGRATION_EXPECTED_USER: bibitasks_migrator
      PGPASSWORD: ci-admin-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install --require-hashes --requirement requirements.lock
          pip install --require-hashes --requirement requirements-migration.lock
          pip install pip-audit==2.10.1
          pip-audit --requirement requirements-migration.lock --progress-spinner off
      - name: Create least-privileged migration owner
        run: |
          psql -h 127.0.0.1 -U postgres -d bibitasks_migration -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bibitasks_migrator LOGIN PASSWORD 'ci-migration-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          GRANT CONNECT ON DATABASE bibitasks_migration TO bibitasks_migrator;
          ALTER SCHEMA public OWNER TO bibitasks_migrator;
          SQL
      - name: Compile migration harness
        run: >-
          python -m py_compile db_migration/*.py migrations/env.py
          migrations/versions/*.py scripts/pg_harness_common.py
          scripts/migrate_sqlite_to_postgres.py
          scripts/reconcile_sqlite_postgres.py
          tests/fixtures/build_current_sqlite.py
      - name: Create exact PostgreSQL baseline
        run: |
          alembic upgrade head
          alembic upgrade head
      - name: Build synthetic canonical SQLite source
        run: python tests/fixtures/build_current_sqlite.py --data-dir "$RUNNER_TEMP/migration-source"
      - name: Migration guard unit tests
        env:
          MIGRATION_SOURCE: ${{ runner.temp }}/migration-source/bibitasks.db
        run: python -m unittest discover -s migration_tests -v
      - name: Type-check all source rows without writes
        run: >-
          python scripts/migrate_sqlite_to_postgres.py
          --source "$RUNNER_TEMP/migration-source/bibitasks.db"
      - name: Refuse a mismatched PostgreSQL port
        shell: bash
        run: |
          set +e
          python scripts/migrate_sqlite_to_postgres.py \
            --source "$RUNNER_TEMP/migration-source/bibitasks.db" \
            --apply --writers-stopped \
            --database-url "$MIGRATION_DATABASE_URL" \
            --expected-database bibitasks_migration \
            --expected-schema public \
            --expected-server-address 127.0.0.1 \
            --expected-server-port 5433 \
            --expected-user bibitasks_migrator
          status=$?
          set -e
          test "$status" -eq 3
      - name: Import in one guarded transaction
        run: >-
          python scripts/migrate_sqlite_to_postgres.py
          --source "$RUNNER_TEMP/migration-source/bibitasks.db"
          --apply --writers-stopped
          --database-url "$MIGRATION_DATABASE_URL"
          --expected-database bibitasks_migration
          --expected-schema public
          --expected-server-address 127.0.0.1
          --expected-server-port 5432
          --expected-user bibitasks_migrator
          --report "$RUNNER_TEMP/migration-report.json"
      - name: Refuse destructive schema rollback
        shell: bash
        run: |
          set +e
          alembic downgrade base
          status=$?
          set -e
          test "$status" -ne 0
          test "$(psql -h 127.0.0.1 -U postgres -d bibitasks_migration -Atc \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='members'")" -eq 1
      - name: Independently reconcile source and target
        run: >-
          python scripts/reconcile_sqlite_postgres.py
          --source "$RUNNER_TEMP/migration-source/bibitasks.db"
          --database-url "$MIGRATION_DATABASE_URL"
          --expected-database bibitasks_migration
          --expected-schema public
          --expected-server-address 127.0.0.1
          --expected-server-port 5432
          --expected-user bibitasks_migrator
          --report "$RUNNER_TEMP/reconciliation-report.json"
      - name: Verify nonempty-target guard and identity state
        shell: bash
        run: |
          set +e
          python scripts/migrate_sqlite_to_postgres.py \
            --source "$RUNNER_TEMP/migration-source/bibitasks.db" \
            --apply --writers-stopped \
            --database-url "$MIGRATION_DATABASE_URL" \
            --expected-database bibitasks_migration \
            --expected-schema public \
            --expected-server-address 127.0.0.1 \
            --expected-server-port 5432 \
            --expected-user bibitasks_migrator
          status=$?
          set -e
          test "$status" -eq 3
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["MIGRATION_DATABASE_URL"].replace("+psycopg", "")) as db:
              for table in ("tasks", "bonus_ledger", "product_events"):
                  maximum, next_value = db.execute(
                      f'SELECT COALESCE(MAX(id),0), nextval(pg_get_serial_sequence(%s, %s)) FROM "{table}"',
                      (table, "id"),
                  ).fetchone()
                  assert next_value == maximum + 1, (table, maximum, next_value)
              db.rollback()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: postgres-migration-redacted-reports
          path: |
            ${{ runner.temp }}/migration-report.json
            ${{ runner.temp }}/reconciliation-report.json
          if-no-files-found: ignore
          retention-days: 14
