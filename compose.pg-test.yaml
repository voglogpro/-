services:
  postgres-migration:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    profiles: ["migration"]
    environment:
      POSTGRES_DB: bibitasks_migration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bibitasks_migration"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./deploy/postgres-init-migration.sql:/docker-entrypoint-initdb.d/10-migration-role.sql:ro
    security_opt:
      - no-new-privileges:true
